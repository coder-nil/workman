[package]
name = "toiler-server"
version = "1.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "toiler 的 HTTP/SSE 服务：复刻 pi-desktop 的 /api 契约"

[dependencies]
toiler-session = { path = "../toiler-session" }
rpi-harness = { workspace = true }
rpi-agent = { workspace = true }
rpi-ai = { workspace = true, features = ["providers"] }
rpi-tools = { workspace = true }

axum = { version = "0.8", features = ["json", "query", "multipart"] }
# 上传直接在已读入的字节上解 multipart：axum 的 `Multipart` 抽取器会强制套一层
# 2MB 的 `DefaultBodyLimit`，与路由里声明的 25MB / 100MB 上限矛盾（见
# `routes/files.rs` 的 `upload_receive`）。版本跟随 axum 自己的依赖（3.1）。
multer = "3"
tokio-util = "0.7"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal", "process"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"
base64 = "0.22"
# Qoder CN（COSY 签名）：md5 盖 body、sha512 派生机器令牌、AES-128-CBC 包身份、
# RSA-PKCS1v15 包会话密钥 —— 与官方客户端的字节级对齐，不能换算法。
md-5 = "0.10"
sha2 = "0.10"
aes = "0.8"
cbc = "0.1"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
# 项目列表 / 选中项目与 pi-desktop 共用一个 SQLite 库（`pi.sqlite`）
rusqlite = { version = "0.31", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
bytes = "1"
url = "2"
# 前端产物在编译期嵌入二进制（阶段 4：不再带 node 运行时）
include_dir = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# DOCX 预览：zip 容器里的 deflate 流（pi 用 mammoth，这里自己解 OOXML）
flate2 = "1"
# 手机配对地址：punycode ↔ Unicode 域名互转（与 pi 的 domainToASCII/Unicode 同源）
idna = "1"
# 枚举本机网卡，挑一个手机最可能连上的内网 IPv4（pi 用 os.networkInterfaces）
libc = "0.2"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
